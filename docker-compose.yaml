# Shared networks and volumes. Django image defaults live in docker-compose.base.yaml
# (referenced only via `extends`, never started as its own container).
# Volume and network names are prefixed so this stack can run beside Core Connect.

networks:
  network_docker:
    name: claro_rf_check_network
    driver: bridge
    external: false

volumes:
  postgres_data:
    name: claro_rf_check_postgres_data
  portainer_data:
    name: claro_rf_check_portainer_data
  pgadmin_data:
    name: claro_rf_check_pgadmin_data
  minio_data:
    name: claro_rf_check_minio_data

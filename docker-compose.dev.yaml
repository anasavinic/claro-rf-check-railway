include:
  - docker-compose.yaml

services:
  postgres:
    image: postgres:14.13
    container_name: claro_rf_check_postgres
    env_file: .env.dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network_docker
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  pgadmin:
    image: dpage/pgadmin4:9.14.0
    container_name: claro_rf_check_pgadmin
    restart: always
    env_file: .env.dev
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "50525:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network_docker
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:8.0.2
    container_name: claro_rf_check_redis
    restart: always
    ports:
      - "6381:6379"
    networks:
      - network_docker

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: claro_rf_check_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBS_SECRET_KEY:-minioadmin}
    ports:
      # Offset from Core Connect (9100/9101) and auditmail (9110/9111).
      - "9120:9000"
      - "9121:9001"
    volumes:
      - minio_data:/data
    networks:
      - network_docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  minio_init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: claro_rf_check_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - network_docker
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${OBS_ACCESS_KEY:-minioadmin} $${OBS_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/$${OBS_BUCKET_NAME:-claro-rf-check};
      exit 0;
      "
    env_file: .env.dev
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: claro_rf_check_mailpit
    restart: always
    ports:
      # Offset from Core Connect (8025/1025) and auditmail (8026/1026).
      - "8027:8025"
      - "1027:1025"
    networks:
      - network_docker
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  celery:
    extends:
      file: docker-compose.base.yaml
      service: x-django-base
    build:
      target: dev
    container_name: claro_rf_check_celery
    env_file: .env.dev
    volumes:
      - ./code:/code
    restart: always
    healthcheck:
      test: ["CMD", "celery", "-A", "claro_rf_check", "status"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: celery -A claro_rf_check worker --loglevel=info
    user: celery_user

  celery_beat:
    extends:
      file: docker-compose.base.yaml
      service: x-django-base
    build:
      target: dev
    container_name: claro_rf_check_celery_beat
    env_file: .env.dev
    volumes:
      - ./code:/code
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    user: celery_user
    command: celery -A claro_rf_check beat --loglevel=info

  flower:
    extends:
      file: docker-compose.base.yaml
      service: x-django-base
    build:
      target: dev
    container_name: claro_rf_check_flower
    env_file: .env.dev
    volumes:
      - ./code:/code
    ports:
      - "8009:5555"
    depends_on:
      celery:
        condition: service_healthy
    command: celery -A claro_rf_check flower --loglevel=info

  portainer:
    image: portainer/portainer-ce:2.40.0
    container_name: claro_rf_check_portainer
    restart: always
    ports:
      - "9002:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - network_docker

  django:
    extends:
      file: docker-compose.base.yaml
      service: x-django-base
    build:
      target: dev
    container_name: claro_rf_check
    env_file: .env.dev
    environment:
      - DEBUG_PYCHARM=${DEBUG_PYCHARM}
      - DEBUG_VSCODE=${DEBUG_VSCODE}
      # Default true so imports use Redis + worker. Override with DEBUG_CELERY=false.
      - DEBUG_CELERY=${DEBUG_CELERY:-true}
      - OS=docker
    volumes:
      - ./code:/code
    ports:
      - "8007:8000"
      - "5682:5679"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  mkdocs:
    build: ./docs
    container_name: claro_rf_check_mkdocs
    restart: always
    ports:
      - "8008:8000"
    volumes:
      - .:/docs
    working_dir: /docs
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - WATCHFILES_POLL_DELAY=1
    command: serve -a 0.0.0.0:8000 --dirtyreload
    networks:
      - network_docker

include:
  - docker-compose.yaml

services:
  postgres:
    image: postgres:14.13
    container_name: claro_rf_check_postgres_prod
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - network_docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

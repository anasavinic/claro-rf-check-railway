services:
  x-django-base:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        CORE_CONNECT_SSO_PROJECT_ID: ${CORE_CONNECT_SSO_PROJECT_ID:-84791364}
        GITLAB_PYPI_USER: ${GITLAB_PYPI_USER:-gitlab-ci-token}
        GITLAB_PYPI_TOKEN: ${GITLAB_PYPI_TOKEN}
    volumes:
      - ./code:/code
    extra_hosts:
      # Reach Core Connect published on the host (INTERNAL_ISSUER)
      - "host.docker.internal:host-gateway"
    networks:
      - network_docker
    restart: always

{% extends "base.html" %}

{% block title %}Sign in — Claro RF Check{% endblock %}

{% block content %}
<div class="bg-background flex min-h-screen items-center justify-center p-6">
	<form method="post" class="bg-white border border-thin-gray flex w-full max-w-md flex-col gap-4 rounded-xl px-8 py-8">
		{% csrf_token %}
		<div>
			<p class="font-medium text-[18px] text-dark-blue">Sign in</p>
			<p class="mt-1 text-[12px] text-muted">Local test account for this Railway deployment.</p>
		</div>
		{% if form.errors %}
		<p class="text-[13px] text-danger">Invalid username or password.</p>
		{% endif %}
		<label class="flex flex-col gap-1 text-[13px] text-secondary">
			Username
			<input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" required
			       class="rounded-lg border border-thin-gray px-3 py-2 text-dark-blue">
		</label>
		<label class="flex flex-col gap-1 text-[13px] text-secondary">
			Password
			<input type="password" name="password" autocomplete="current-password" required
			       class="rounded-lg border border-thin-gray px-3 py-2 text-dark-blue">
		</label>
		<input type="hidden" name="next" value="{{ next }}">
		<button type="submit" class="rounded-lg bg-primary py-2 text-[14px] text-white">Sign in</button>
	</form>
</div>
{% endblock %}

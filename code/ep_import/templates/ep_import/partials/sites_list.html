{% load static %}
<div class="bg-white border border-thin-gray flex flex-col gap-4 h-full min-h-0 overflow-hidden items-start min-w-0 p-5 rounded-xl flex-1"
     id="sites-card">
	<p class="font-semibold text-[14px] text-dark-blue w-full">
		{% if sites_total %}Sites found ({{ sites_total }}){% else %}Sites found{% endif %}
	</p>

	{% if not job or job.status != 'success' %}
	<div class="flex flex-1 flex-col gap-3 items-center justify-center p-10 w-full">
		<img src="{% static 'ep_import/icons/search.svg' %}" alt="" class="size-10">
		<p class="font-normal text-[13px] text-secondary text-center">No sites found. Upload an EP file.</p>
	</div>
	{% else %}
	<div class="relative w-full">
		<img src="{% static 'ep_import/icons/search.svg' %}" alt="" class="absolute left-3 top-1/2 -translate-y-1/2 size-4">
		<input type="search"
		       name="q"
		       value="{{ search }}"
		       placeholder="Search by site name..."
		       class="w-full border border-thin-gray rounded-lg pl-9 pr-3 py-2 text-[13px] focus:outline-none focus:border-primary"
		       hx-get="{% url 'ep_import:job_sites' job_id=job.id %}?technology={{ technology }}"
		       hx-trigger="keyup changed delay:300ms, search"
		       hx-target="#sites-results"
		       hx-swap="innerHTML"
		       hx-include="this">
	</div>
	<div id="sites-results" class="flex flex-1 flex-col min-h-0 w-full">
		{% include "ep_import/partials/sites_results.html" %}
	</div>
	{% endif %}
</div>

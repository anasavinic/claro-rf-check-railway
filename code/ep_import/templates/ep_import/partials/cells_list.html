{% load static %}
<div class="bg-white border border-thin-gray flex flex-col gap-4 h-full min-h-0 overflow-hidden items-start min-w-0 p-5 rounded-xl flex-1"
     id="cells-panel">
	{% if site %}
	<div class="flex items-center justify-between w-full gap-3">
		<p class="font-semibold text-[14px] text-dark-blue">Cells ({{ cells_total }})</p>
		<div class="flex gap-3 text-[12px]">
			<button type="button" class="text-primary font-semibold cursor-pointer" @click="selectAllCells">Select all</button>
			<button type="button" class="text-muted font-semibold" @click="clearCells">Clear</button>
		</div>
	</div>
	<div class="relative w-full">
		<img src="{% static 'ep_import/icons/search.svg' %}" alt="" class="absolute left-3 top-1/2 -translate-y-1/2 size-4">
		<input type="search"
		       name="q"
		       value="{{ search }}"
		       placeholder="Search by Cell ID, band, or frequency..."
		       class="w-full border border-thin-gray rounded-lg pl-9 pr-3 py-2 text-[13px] focus:outline-none focus:border-primary"
		       hx-get="{% url 'ep_import:job_cells' job_id=job.id %}?technology={{ technology }}&site={{ site|urlencode }}"
		       hx-trigger="keyup changed delay:300ms, search"
		       hx-target="#cells-results"
		       hx-swap="innerHTML"
		       hx-include="this">
	</div>
	<div id="cells-results" class="flex flex-1 flex-col min-h-0 w-full">
		{% include "ep_import/partials/cells_results.html" %}
	</div>
	{% else %}
	<p class="font-semibold text-[14px] text-dark-blue w-full">Site cells</p>
	<div class="flex flex-1 flex-col gap-3 items-center justify-center p-10 w-full">
		<img src="{% static 'ep_import/icons/layers.svg' %}" alt="" class="size-10">
		<p class="font-normal text-[13px] text-secondary text-center">Select a site to see its cells.</p>
	</div>
	{% endif %}
</div>
